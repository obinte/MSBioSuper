# Configuración de pruebas de rendimiento Gatling para MSBioSuper

# URL base de la API
baseUrl=http://localhost:8080

# Credenciales de prueba (deben existir en la base de datos)
test.username=testuser
test.password=testpass123

# Token JWT (se puede generar previamente o durante la prueba)
# Dejar vacío para generar durante la ejecución
test.jwt.token=

# Configuración de carga
# Usuarios concurrentes para pruebas de carga
load.users=100
# Duración de la rampa (tiempo para alcanzar usuarios máximos) en segundos
load.rampDuration=60
# Duración total de la prueba en segundos
load.testDuration=300

# Configuración de estrés
# Usuarios concurrentes para pruebas de estrés
stress.users=500
# Duración de la rampa en segundos
stress.rampDuration=120
# Duración total de la prueba en segundos
stress.testDuration=600

# Configuración de spike
# Usuarios concurrentes para pruebas de pico
spike.users=1000
# Duración del pico en segundos
spike.duration=30

# Parámetros de prueba para endpoints
# Fechas de ejemplo (formato: yyyy-MM-dd)
test.fechaInicio=2024-01-01
test.fechaFin=2024-12-31
test.empresaCodigo=001
test.piscinaCodigo=P001
