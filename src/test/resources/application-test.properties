# Configuración de pruebas con H2 en memoria
# Este archivo se activa con el perfil 'test' (@ActiveProfiles("test"))

# Configuración de base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar inicialización de datos
spring.sql.init.mode=never

# Logging para pruebas
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.test=INFO

# Configuración JWT para pruebas
# JWT_SECRET=${JWT_SECRET:TEST_SECRET_FOR_INTEGRATION_TESTS_ONLY}
JWT_SECRET=${JWT_SECRET:TEST_SECRET_FOR_INTEGRATION_TESTS_ONLY}

# Configuración de Actuator para pruebas
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.probes.enabled=true
management.metrics.tags.application=msbiosuper
management.metrics.tags.environment=test
