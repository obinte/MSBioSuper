#########################
# Configuración de Gatling
#########################

gatling {
  core {
    # Directorio de salida para reportes
    outputDirectoryBaseName = "msbiosuper"
    
    # Codificación de caracteres
    encoding = "utf-8"
    
    # Nivel de simulación
    simulationClass = ""
  }
  
  charting {
    # Indicadores para reportes
    indicators {
      lowerBound = 200      # Umbral bajo en ms (verde)
      higherBound = 500     # Umbral alto en ms (amarillo/rojo)
      percentile1 = 50      # Percentil 50 (mediana)
      percentile2 = 75      # Percentil 75
      percentile3 = 95      # Percentil 95
      percentile4 = 99      # Percentil 99
    }
  }
  
  http {
    # Configuración de timeouts
    requestTimeout = 60000                # 60 segundos
    
    # Pool de conexiones
    pooledConnectionIdleTimeout = 60000   # 60 segundos
    maxConnectionsPerHost = 6
    
    # Configuración de DNS
    perUserNameResolution = false
  }
  
  data {
    # Directorio de datos de prueba
    writers = [console, file]
  }
}
