# ============================================
# CONFIGURACIÓN DE DESARROLLO (DEV)
# ============================================
# Este perfil se activa con: --spring.profiles.active=dev
# o mediante variable de entorno: SPRING_PROFILES_ACTIVE=dev

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS - DESARROLLO
# ============================================
# Base de datos local de desarrollo
# Usar variables de entorno para flexibilidad entre desarrollo nativo y Docker
spring.datasource.url=jdbc:postgresql://${JDBC_SERVER:localhost}:${JDBC_PORT:5432}/${JDBC_DATABASE:msbiosuper_dev}
spring.datasource.username=${JDBC_USER:dev_user}
spring.datasource.password=${JDBC_PASSWORD:dev_password}

# ============================================
# CONFIGURACIÓN DE HIKARICP - DESARROLLO
# ============================================
# Pool más pequeño para desarrollo local
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=MSBioSuperDevPool

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE - DESARROLLO
# ============================================
# Mostrar SQL en consola para debugging
spring.jpa.show-sql=true

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Mostrar comentarios SQL
spring.jpa.properties.hibernate.use_sql_comments=true

# Habilitar estadísticas de Hibernate para análisis de rendimiento
spring.jpa.properties.hibernate.generate_statistics=true

# Validar esquema al inicio (útil para detectar problemas)
spring.jpa.hibernate.ddl-auto=validate

# ============================================
# CONFIGURACIÓN DE SERVIDOR - DESARROLLO
# ============================================
# Puerto de desarrollo
server.port=8080

# Habilitar hot reload con DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ============================================
# CONFIGURACIÓN DE LOGGING - DESARROLLO
# ============================================
# Nivel de logging por defecto
logging.level.root=INFO

# ============================================
# LOGS DE LA APLICACIÓN MSBIOSUPER - DESARROLLO
# ============================================
# Nivel de logging detallado para toda la aplicación
logging.level.com.acosux.MSBiosuper=DEBUG

# Nivel de logging para la capa de dominio
logging.level.com.acosux.MSBiosuper.domain=DEBUG

# Nivel de logging para la capa de aplicación (casos de uso)
logging.level.com.acosux.MSBiosuper.application=DEBUG

# Nivel de logging para la capa de infraestructura
logging.level.com.acosux.MSBiosuper.infrastructure=DEBUG

# Nivel de logging para controladores REST
logging.level.com.acosux.MSBiosuper.infrastructure.rest=DEBUG

# Nivel de logging para seguridad
logging.level.com.acosux.MSBiosuper.infrastructure.security=DEBUG

# Nivel de logging para configuración
logging.level.com.acosux.MSBiosuper.infrastructure.config=DEBUG

# ============================================
# LOGS DE SPRING FRAMEWORK - DESARROLLO
# ============================================
# Nivel de logging para Spring Framework
logging.level.org.springframework=INFO

# Nivel de logging para Spring Boot
logging.level.org.springframework.boot=INFO

# Nivel de logging para Spring Web (detallado)
logging.level.org.springframework.web=DEBUG

# Nivel de logging para Spring MVC
logging.level.org.springframework.web.servlet.mvc=DEBUG

# Nivel de logging para Spring Security (detallado)
logging.level.org.springframework.security=DEBUG

# Nivel de logging para Spring Security Web
logging.level.org.springframework.security.web=DEBUG

# Nivel de logging para Spring Data JPA
logging.level.org.springframework.data.jpa=DEBUG

# Nivel de logging para Spring Transaction
logging.level.org.springframework.transaction=DEBUG

# Nivel de logging para Spring JDBC
logging.level.org.springframework.jdbc=DEBUG

# Nivel de logging para Spring Context
logging.level.org.springframework.context=INFO

# ============================================
# LOGS DE HIBERNATE - DESARROLLO
# ============================================
# Nivel de logging general para Hibernate
logging.level.org.hibernate=INFO

# Nivel de logging para SQL generado por Hibernate (detallado)
logging.level.org.hibernate.SQL=DEBUG

# Nivel de logging para valores de parámetros SQL (muy detallado)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Nivel de logging para valores extraídos de SQL
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=TRACE

# Nivel de logging para transacciones de Hibernate (detallado)
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=DEBUG

# Nivel de logging para caché de Hibernate
logging.level.org.hibernate.cache=DEBUG

# Nivel de logging para estadísticas de Hibernate (detallado)
logging.level.org.hibernate.stat=DEBUG

# Nivel de logging para motor de Hibernate
logging.level.org.hibernate.engine=INFO

# ============================================
# LOGS DE HIKARICP - DESARROLLO
# ============================================
# Nivel de logging detallado para HikariCP
logging.level.com.zaxxer.hikari=DEBUG

# Nivel de logging para configuración de HikariCP (detallado)
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Nivel de logging para pool de HikariCP (detallado)
logging.level.com.zaxxer.hikari.pool=DEBUG

# Nivel de logging para detección de fugas de HikariCP
logging.level.com.zaxxer.hikari.pool.ProxyLeakTask=WARN

# ============================================
# LOGS DE OTRAS LIBRERÍAS - DESARROLLO
# ============================================
# Nivel de logging para driver PostgreSQL
logging.level.org.postgresql=INFO

# Nivel de logging para Jackson (serialización JSON)
logging.level.com.fasterxml.jackson=INFO

# Nivel de logging para Tomcat embebido
logging.level.org.apache.catalina=INFO

# Nivel de logging para Tomcat Coyote (conector HTTP)
logging.level.org.apache.coyote=INFO

# Nivel de logging para SpringDoc OpenAPI
logging.level.org.springdoc=DEBUG

# Nivel de logging para Micrometer (métricas)
logging.level.io.micrometer=DEBUG

# Nivel de logging para Actuator
logging.level.org.springframework.boot.actuate=DEBUG

# ============================================
# PATRÓN DE LOGGING - DESARROLLO
# ============================================
# Patrón de consola con colores para mejor legibilidad
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# ============================================
# CONFIGURACIÓN DE ACTUATOR - DESARROLLO
# ============================================
# Exponer todos los endpoints en desarrollo
management.endpoints.web.exposure.include=*

# Mostrar siempre detalles de health
management.endpoint.health.show-details=always

# Habilitar todos los health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ============================================
# CONFIGURACIÓN DE MÉTRICAS - DESARROLLO
# ============================================
# Habilitar todas las métricas en desarrollo para debugging
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.http=true
management.metrics.enable.jdbc=true

# Métricas HTTP con percentiles detallados
management.metrics.web.server.request.autotime.percentiles=0.5,0.75,0.9,0.95,0.99,0.999

# Habilitar histogramas para análisis detallado
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Prometheus habilitado en desarrollo
management.metrics.export.prometheus.enabled=true

# Tags para identificar entorno de desarrollo
management.metrics.tags.environment=dev

# ============================================
# CONFIGURACIÓN DE SEGURIDAD JWT - DESARROLLO
# ============================================
# Clave de desarrollo (NO USAR EN PRODUCCIÓN)
# Esta es una clave de ejemplo para desarrollo local
jwt.secret=${JWT_SECRET:GENERATE_YOUR_OWN_SECRET_KEY_WITH_SCRIPT}

# Token con expiración más larga para desarrollo (7 días)
jwt.expiration=604800000

# ============================================
# CONFIGURACIÓN DE CORS - DESARROLLO
# ============================================
# Permitir todos los orígenes en desarrollo
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8081

# ============================================
# CONFIGURACIÓN DE OPENAPI/SWAGGER - DESARROLLO
# ============================================
# Habilitar completamente en desarrollo
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Mostrar información detallada
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# URL del servidor de desarrollo
app.api.dev-url=http://localhost:8080
app.api.staging-url=https://staging.msbiosuper.acosux.com
app.api.prod-url=https://api.msbiosuper.acosux.com

# ============================================
# CONFIGURACIÓN DE CACHÉ - DESARROLLO
# ============================================
# Deshabilitar caché para ver cambios inmediatamente
spring.cache.type=none

# ============================================
# NOTAS DE DESARROLLO
# ============================================
# - Esta configuración es para desarrollo local únicamente
# - Las credenciales son de ejemplo y deben cambiarse
# - El logging está en modo DEBUG para facilitar el debugging
# - CORS está abierto para facilitar el desarrollo frontend
# - La clave JWT es de ejemplo y NO debe usarse en producción
