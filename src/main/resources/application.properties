# ============================================
# CONFIGURACIÓN BASE DE MSBIOSUPER
# ============================================
# Este archivo contiene la configuración base compartida por todos los entornos.
# Para configuraciones específicas por entorno, usar:
#   - application-dev.properties (desarrollo local)
#   - application-test.properties (pruebas automatizadas)
#   - application-prod.properties (producción)
#
# Activar un perfil específico con:
#   - Línea de comandos: --spring.profiles.active=dev
#   - Variable de entorno: SPRING_PROFILES_ACTIVE=dev
#   - En IDE: Configurar en Run Configuration
#
# ============================================
# CONFIGURACIÓN DE BASE DE DATOS POSTGRESQL
# ============================================
# IMPORTANTE: Las credenciales deben ser proporcionadas mediante variables de entorno
# No se proporcionan valores por defecto por razones de seguridad
spring.datasource.url=jdbc:postgresql://${JDBC_SERVER:localhost}:${JDBC_PORT:5432}/${JDBC_DATABASE}
spring.datasource.username=${JDBC_USER}
spring.datasource.password=${JDBC_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURACIÓN DE HIKARICP - POOL DE CONEXIONES
# ============================================
# Tamaño máximo del pool (20 conexiones)
spring.datasource.hikari.maximum-pool-size=20

# Tamaño mínimo del pool en estado idle
spring.datasource.hikari.minimum-idle=5

# Timeout de conexión (30 segundos = 30000 ms)
spring.datasource.hikari.connection-timeout=30000

# Timeout de inactividad (10 minutos = 600000 ms)
spring.datasource.hikari.idle-timeout=600000

# Tiempo máximo de vida de una conexión (30 minutos = 1800000 ms)
spring.datasource.hikari.max-lifetime=1800000

# Habilitar detección de fugas de conexión (2 segundos = 2000 ms)
spring.datasource.hikari.leak-detection-threshold=2000

# Nombre del pool para identificación en logs
spring.datasource.hikari.pool-name=MSBioSuperHikariPool

# Validación de conexiones
spring.datasource.hikari.connection-test-query=SELECT 1

# Auto-commit habilitado por defecto
spring.datasource.hikari.auto-commit=true

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE 6
# ============================================
# Dialecto de PostgreSQL para Hibernate 6
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# No mostrar SQL en logs (usar logging.level para control fino)
spring.jpa.show-sql=false

# No modificar el esquema de base de datos automáticamente
spring.jpa.hibernate.ddl-auto=none

# Propiedades adicionales de Hibernate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Configuración de caché de segundo nivel (deshabilitado por defecto)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Generación de estadísticas de Hibernate (útil para desarrollo)
spring.jpa.properties.hibernate.generate_statistics=false

# Configuración de timezone para fechas
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================
# CONFIGURACIÓN DE SPRING BOOT 3
# ============================================
# Nombre de la aplicación
spring.application.name=msbiosuper

# Puerto del servidor (por defecto 8080)
server.port=${SERVER_PORT:8080}

# Context path de la aplicación
server.servlet.context-path=/

# Configuración de encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configuración de sesiones
server.servlet.session.timeout=30m

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
# Nivel de logging por defecto
logging.level.root=INFO

# ============================================
# LOGS DE LA APLICACIÓN MSBIOSUPER
# ============================================
# Nivel de logging general para la aplicación
logging.level.com.acosux.MSBiosuper=INFO

# Nivel de logging para la capa de dominio
logging.level.com.acosux.MSBiosuper.domain=INFO

# Nivel de logging para la capa de aplicación (casos de uso)
logging.level.com.acosux.MSBiosuper.application=INFO

# Nivel de logging para la capa de infraestructura
logging.level.com.acosux.MSBiosuper.infrastructure=INFO

# Nivel de logging para controladores REST
logging.level.com.acosux.MSBiosuper.infrastructure.rest=INFO

# Nivel de logging para seguridad
logging.level.com.acosux.MSBiosuper.infrastructure.security=INFO

# Nivel de logging para configuración
logging.level.com.acosux.MSBiosuper.infrastructure.config=INFO

# ============================================
# LOGS DE SPRING FRAMEWORK
# ============================================
# Nivel de logging general para Spring
logging.level.org.springframework=INFO

# Nivel de logging para Spring Boot
logging.level.org.springframework.boot=INFO

# Nivel de logging para Spring Web
logging.level.org.springframework.web=INFO

# Nivel de logging para Spring MVC
logging.level.org.springframework.web.servlet.mvc=INFO

# Nivel de logging para Spring Security
logging.level.org.springframework.security=DEBUG

# Nivel de logging para Spring Security Web
logging.level.org.springframework.security.web=DEBUG

# Nivel de logging para filtros de seguridad personalizados
logging.level.com.acosux.MSBioSuper.security=DEBUG

# Nivel de logging para Spring Data JPA
logging.level.org.springframework.data.jpa=INFO

# Nivel de logging para Spring Transaction
logging.level.org.springframework.transaction=INFO

# Nivel de logging para Spring JDBC
logging.level.org.springframework.jdbc=INFO

# Nivel de logging para Spring Context
logging.level.org.springframework.context=INFO

# ============================================
# LOGS DE HIBERNATE
# ============================================
# Nivel de logging general para Hibernate
logging.level.org.hibernate=INFO

# Nivel de logging para SQL generado por Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Nivel de logging para valores de parámetros SQL (binding)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Nivel de logging para valores extraídos de SQL (extraction)
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=TRACE

# Nivel de logging para transacciones de Hibernate
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=DEBUG

# Nivel de logging para caché de Hibernate
logging.level.org.hibernate.cache=INFO

# Nivel de logging para estadísticas de Hibernate
logging.level.org.hibernate.stat=INFO

# Nivel de logging para motor de Hibernate
logging.level.org.hibernate.engine=INFO

# ============================================
# LOGS DE HIKARICP (POOL DE CONEXIONES)
# ============================================
# Nivel de logging general para HikariCP
logging.level.com.zaxxer.hikari=INFO

# Nivel de logging para configuración de HikariCP
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Nivel de logging para pool de HikariCP
logging.level.com.zaxxer.hikari.pool=INFO

# Nivel de logging para detección de fugas de HikariCP
logging.level.com.zaxxer.hikari.pool.ProxyLeakTask=WARN

# ============================================
# LOGS DE OTRAS LIBRERÍAS
# ============================================
# Nivel de logging para driver PostgreSQL
logging.level.org.postgresql=INFO

# Nivel de logging para Jackson (serialización JSON)
logging.level.com.fasterxml.jackson=INFO

# Nivel de logging para Tomcat embebido
logging.level.org.apache.catalina=INFO

# Nivel de logging para Tomcat Coyote (conector HTTP)
logging.level.org.apache.coyote=INFO

# Nivel de logging para SpringDoc OpenAPI
logging.level.org.springdoc=INFO

# Nivel de logging para Micrometer (métricas)
logging.level.io.micrometer=INFO

# Nivel de logging para Actuator
logging.level.org.springframework.boot.actuate=INFO

# ============================================
# PATRONES DE LOGGING
# ============================================
# Patrón de logging para consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Patrón de logging para archivo (si se habilita)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# CONFIGURACIÓN DE ACTUATOR (OBSERVABILIDAD)
# ============================================
# Habilitar endpoints de actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Mostrar detalles de health check (always, when-authorized, never)
management.endpoint.health.show-details=always

# Mostrar componentes individuales de health
management.endpoint.health.show-components=always

# Habilitar health checks individuales
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Configuración de sondas de liveness y readiness para Kubernetes
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Configuración de grupos de health checks
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace

# Base path para endpoints de actuator
management.endpoints.web.base-path=/actuator

# Habilitar CORS para endpoints de actuator
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
management.endpoints.web.cors.allowed-methods=GET,POST

# ============================================
# CONFIGURACIÓN DE MÉTRICAS Y PROMETHEUS
# ============================================
# Habilitar métricas JVM (memoria, threads, garbage collection)
management.metrics.enable.jvm=true
management.metrics.jvm.memory.enabled=true
management.metrics.jvm.gc.enabled=true
management.metrics.jvm.threads.enabled=true
management.metrics.jvm.classes.enabled=true

# Habilitar métricas del sistema operativo
management.metrics.enable.system=true
management.metrics.system.cpu.enabled=true
management.metrics.system.diskspace.enabled=true

# Habilitar métricas de proceso
management.metrics.enable.process=true
management.metrics.process.cpu.enabled=true
management.metrics.process.uptime.enabled=true
management.metrics.process.files.enabled=true

# Habilitar métricas HTTP (latencia, throughput, errores)
management.metrics.enable.http=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.web.server.request.autotime.percentiles=0.5,0.95,0.99
management.metrics.web.server.request.autotime.percentiles-histogram=true

# Habilitar métricas de base de datos (HikariCP)
management.metrics.enable.jdbc=true
management.metrics.jdbc.datasource.enabled=true

# Configuración de Prometheus
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=1m
management.metrics.export.prometheus.descriptions=true

# Configuración de distribución de métricas
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s

# Tags comunes para todas las métricas
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active:default}

# ============================================
# CONFIGURACIÓN DE SEGURIDAD JWT
# ============================================
# IMPORTANTE: La clave secreta JWT debe ser proporcionada mediante variable de entorno
# Debe ser una cadena de al menos 256 bits (32 caracteres) codificada en Base64
# Usar scripts/generate-jwt-secret.sh para generar una clave segura
jwt.secret=${JWT_SECRET}

# Tiempo de expiración del token en milisegundos (24 horas = 86400000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# CONFIGURACIÓN DE CORS
# ============================================
# Orígenes permitidos (separados por coma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Métodos HTTP permitidos
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Headers permitidos
cors.allowed-headers=*

# Permitir credenciales
cors.allow-credentials=true

# ============================================
# CONFIGURACIÓN DE OPENAPI/SWAGGER
# ============================================
# Habilitar OpenAPI
springdoc.api-docs.enabled=true

# Path de la documentación OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Path de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Habilitar Swagger UI
springdoc.swagger-ui.enabled=true

# Ordenar operaciones por método HTTP
springdoc.swagger-ui.operations-sorter=method

# Ordenar tags alfabéticamente
springdoc.swagger-ui.tags-sorter=alpha

# Habilitar filtro de búsqueda
springdoc.swagger-ui.filter=true

# Mostrar extensiones de vendor
springdoc.swagger-ui.display-request-duration=true

# ============================================
# CONFIGURACIÓN DE SPRING MVC
# ============================================
# Deshabilitar el lanzamiento de NoResourceFoundException para permitir que SpringDoc maneje /v3/api-docs
spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true

# ============================================
# CONFIGURACIÓN DE INFORMACIÓN DE LA API
# ============================================
# Versión de la aplicación
app.version=1.0.0

# URLs de servidores por entorno
app.api.dev-url=${APP_API_DEV_URL:http://localhost:8082}
app.api.staging-url=${API_STAGING_URL:https://staging.msbiosuper.acosux.com}
app.api.prod-url=${API_PROD_URL:https://api.msbiosuper.acosux.com}