# =============================================================================
# MSBioSuper / MSAbricmar — configuración de conexión (US-198, Fase 1)
#
# Las credenciales (jdbc.user y jdbc.password) se leen de AWS Secrets Manager
# cuando aws.secret.name está definido. Este archivo va DENTRO del WAR y NO debe
# contener credenciales reales: los valores de abajo son de relleno.
#
# El código NO depende del nombre del rol: usuario y contraseña salen del secreto.
# Durante la Fase 1 (transición) el secreto guarda las credenciales de
# administradores; en la Fase 2 se cambia SOLO el contenido del secreto al rol
# propio, sin tocar código ni redeplegar (ver US-198 y US-240).
# =============================================================================

jdbc.server=localhost
jdbc.port=5433
jdbc.database=cloud
# Valores de relleno (NO son credenciales reales). jdbc.user neutro: no es el nombre
# del rol, que llega desde el secreto. jdbc.password=_REQUIRES_AWS_SECRET_ fuerza el
# fallo cerrado si el secreto no se puede leer.
jdbc.user=_REQUIRES_AWS_SECRET_
jdbc.password=_REQUIRES_AWS_SECRET_

# --- AWS Secrets Manager (región us-east-1) --------------------------------------
# Si aws.secret.name está definido, jdbc.user y jdbc.password se toman del secreto
# {"jdbc.user":"...","jdbc.password":"..."}. Si el secreto no se puede leer, se usan
# los valores de relleno de arriba: con _REQUIRES_AWS_SECRET_ la conexión FALLA
# (fallo cerrado). Nunca se escribe en el log el valor del secreto ni la contraseña.
#
# Nombre del secreto (provisional, pendiente del debate de US-242):
#   aws.secret.name=data.acosux.com/msintegraciones
# El mismo secreto lo usan los dos despliegues. En Fase 1 el secreto contiene las
# credenciales de administradores (transición); en Fase 2 se cambia su contenido al
# rol propio. El código es independiente del nombre del rol.
#aws.secret.name=data.acosux.com/msintegraciones

# --- Config por despliegue (mismo WAR, dos despliegues) --------------------------
# MSBioSuper y MSAbricmar son el MISMO WAR. Solo cambian jdbc.database y
# jdbc.applicationname. Como este application.properties va dentro del WAR, cada
# despliegue debe tener SU PROPIA copia editada en el servidor (mecanismo de US-190,
# README de sql/updates/scripts/US-190-msgenia-roles/, paso 5):
#
#   webapps/<contexto>/WEB-INF/classes/application.properties
#
# Se edita DESPUÉS de desplegar el WAR (con respaldo previo del archivo):
#   MSBioSuper -> jdbc.database=cloud   jdbc.applicationname=MSBioSuper-cloud
#   MSAbricmar -> jdbc.database=shrimp  jdbc.applicationname=MSAbricmar-shrimp
#   los dos    -> aws.secret.name=data.acosux.com/msintegraciones
#                 (jdbc.user y jdbc.password conservan el centinela de abajo)
#
# NO usar -Djdbc.database ni variables de entorno: esos valores valen para TODA la JVM
# de Tomcat, no por contexto. Si MSBioSuper y MSAbricmar (u otros microservicios como
# MSGenia*) comparten Tomcat, todos recibirían la misma base y un despliegue podría
# devolver datos de otra empresa. Alternativa válida porque sí es POR CONTEXTO: un
# <Parameter> en conf/Catalina/localhost/<contexto>.xml.
#
# Por defecto, si no se define jdbc.applicationname, PersistenceConfig usa
# MSBioSuper-<jdbc.database>.
#jdbc.applicationname=MSBioSuper-cloud

# --- Pool de conexiones (configurable por propiedad) -----------------------------
# PENDIENTE DE VALIDAR: el valor inicial (2) se hereda de MSVitapro (US-190) y NO está
# validado con el tráfico real de MSBioSuper/MSAbricmar. Ajustar con métricas (US-240).
#pool.maxTotal=2
#pool.maxIdle=2
#pool.minIdle=0
#pool.initialSize=0
#pool.maxWaitMillis=8000
