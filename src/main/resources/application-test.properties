# ============================================
# CONFIGURACIÓN DE PRUEBAS (TEST)
# ============================================
# Este perfil se activa con: --spring.profiles.active=test
# Usa base de datos H2 en memoria para pruebas

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS H2 - PRUEBAS
# ============================================
# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE - PRUEBAS
# ============================================
# Crear esquema automáticamente para H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mostrar SQL para debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CONFIGURACIÓN DE SERVIDOR - PRUEBAS
# ============================================
server.port=8080

# ============================================
# CONFIGURACIÓN DE ACTUATOR - PRUEBAS
# ============================================
# Exponer todos los endpoints para verificación
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Mostrar detalles de health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Habilitar health checks
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Configuración de sondas de liveness y readiness
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================
# CONFIGURACIÓN DE MÉTRICAS - PRUEBAS
# ============================================
# Habilitar métricas JVM
management.metrics.enable.jvm=true
management.metrics.jvm.memory.enabled=true
management.metrics.jvm.gc.enabled=true
management.metrics.jvm.threads.enabled=true

# Habilitar métricas HTTP
management.metrics.enable.http=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.web.server.request.autotime.percentiles=0.5,0.95,0.99

# Habilitar métricas de base de datos
management.metrics.enable.jdbc=true
management.metrics.jdbc.datasource.enabled=true

# Configuración de Prometheus
management.metrics.export.prometheus.enabled=true

# Tags para identificar entorno de pruebas
management.metrics.tags.application=msbiosuper
management.metrics.tags.environment=test

# ============================================
# CONFIGURACIÓN DE SEGURIDAD JWT - PRUEBAS
# ============================================
jwt.secret=${JWT_SECRET:TEST_SECRET_KEY_FOR_UNIT_TESTS_ONLY}
jwt.expiration=86400000

# ============================================
# CONFIGURACIÓN DE CORS - PRUEBAS
# ============================================
cors.allowed-origins=http://localhost:3000,http://localhost:4200

# ============================================
# CONFIGURACIÓN DE LOGGING - PRUEBAS
# ============================================
logging.level.root=INFO
logging.level.com.acosux.MSBiosuper=INFO
logging.level.org.springframework.boot.actuate=DEBUG
logging.level.io.micrometer=DEBUG

# ============================================
# CONFIGURACIÓN DE OPENAPI/SWAGGER - PRUEBAS
# ============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true