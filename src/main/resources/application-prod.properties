# ============================================
# CONFIGURACIÓN DE PRODUCCIÓN (PROD)
# ============================================
# Este perfil se activa con: --spring.profiles.active=prod
# o mediante variable de entorno: SPRING_PROFILES_ACTIVE=prod
#
# IMPORTANTE: Esta configuración está optimizada para entornos de producción
# con enfoque en seguridad, rendimiento y observabilidad.
#
# REQUISITOS:
# - TR-11: Gestión de secretos externalizados
# - TR-23: Configuración Maven por entornos
#
# ============================================
# CONFIGURACIÓN DE BASE DE DATOS - PRODUCCIÓN
# ============================================
# IMPORTANTE: Todas las credenciales DEBEN ser proporcionadas mediante variables de entorno
# NO se proporcionan valores por defecto por razones de seguridad

# Conexión a base de datos de producción
spring.datasource.url=jdbc:postgresql://${JDBC_SERVER}:${JDBC_PORT}/${JDBC_DATABASE}
spring.datasource.username=${JDBC_USER}
spring.datasource.password=${JDBC_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURACIÓN DE HIKARICP - PRODUCCIÓN
# ============================================
# Pool optimizado para alta carga en producción
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Timeouts optimizados para producción
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Detección de fugas de conexión (crítico en producción)
spring.datasource.hikari.leak-detection-threshold=2000

# Nombre del pool para identificación en logs y métricas
spring.datasource.hikari.pool-name=MSBioSuperProdPool

# Validación de conexiones para garantizar disponibilidad
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# Auto-commit habilitado para mejor rendimiento
spring.datasource.hikari.auto-commit=true

# Configuración adicional para producción
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.register-mbeans=true

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE - PRODUCCIÓN
# ============================================
# Dialecto de PostgreSQL para Hibernate 6
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# NO mostrar SQL en producción (seguridad y rendimiento)
spring.jpa.show-sql=false

# NO modificar el esquema de base de datos automáticamente
spring.jpa.hibernate.ddl-auto=none

# Propiedades optimizadas para producción
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Optimizaciones de batch para mejor rendimiento
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Configuración de caché de segundo nivel (habilitado para producción)
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# NO generar estadísticas en producción (impacto en rendimiento)
spring.jpa.properties.hibernate.generate_statistics=false

# Configuración de timezone para fechas
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optimizaciones adicionales para producción
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# ============================================
# CONFIGURACIÓN DE SERVIDOR - PRODUCCIÓN
# ============================================
# Puerto de producción (configurable via variable de entorno)
server.port=${SERVER_PORT:8080}

# Context path de la aplicación
server.servlet.context-path=/

# Configuración de encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configuración de sesiones (más restrictiva en producción)
server.servlet.session.timeout=15m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Configuración de compresión HTTP (habilitada para producción)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Configuración de HTTP/2 (habilitado para mejor rendimiento)
server.http2.enabled=true

# Configuración de Tomcat para producción
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# Configuración de buffers para mejor rendimiento
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB

# Configuración de acceso a logs (deshabilitado en producción por rendimiento)
server.tomcat.accesslog.enabled=false

# ============================================
# CONFIGURACIÓN DE LOGGING - PRODUCCIÓN
# ============================================
# Nivel de logging por defecto (solo errores y warnings)
logging.level.root=WARN

# ============================================
# LOGS DE LA APLICACIÓN MSBIOSUPER - PRODUCCIÓN
# ============================================
# Nivel de logging para la aplicación (solo información importante)
logging.level.com.acosux.MSBiosuper=INFO

# Nivel de logging para la capa de dominio
logging.level.com.acosux.MSBiosuper.domain=INFO

# Nivel de logging para la capa de aplicación (casos de uso)
logging.level.com.acosux.MSBiosuper.application=INFO

# Nivel de logging para la capa de infraestructura
logging.level.com.acosux.MSBiosuper.infrastructure=INFO

# Nivel de logging para controladores REST
logging.level.com.acosux.MSBiosuper.infrastructure.rest=INFO

# Nivel de logging para seguridad (importante para auditoría)
logging.level.com.acosux.MSBiosuper.infrastructure.security=INFO

# Nivel de logging para configuración
logging.level.com.acosux.MSBiosuper.infrastructure.config=WARN

# ============================================
# LOGS DE SPRING FRAMEWORK - PRODUCCIÓN
# ============================================
# Nivel de logging para Spring Framework (solo warnings y errores)
logging.level.org.springframework=WARN

# Nivel de logging para Spring Boot
logging.level.org.springframework.boot=WARN

# Nivel de logging para Spring Web
logging.level.org.springframework.web=WARN

# Nivel de logging para Spring MVC
logging.level.org.springframework.web.servlet.mvc=WARN

# Nivel de logging para Spring Security (importante para auditoría)
logging.level.org.springframework.security=INFO

# Nivel de logging para Spring Security Web
logging.level.org.springframework.security.web=WARN

# Nivel de logging para Spring Data JPA
logging.level.org.springframework.data.jpa=WARN

# Nivel de logging para Spring Transaction
logging.level.org.springframework.transaction=WARN

# Nivel de logging para Spring JDBC
logging.level.org.springframework.jdbc=WARN

# Nivel de logging para Spring Context
logging.level.org.springframework.context=WARN

# ============================================
# LOGS DE HIBERNATE - PRODUCCIÓN
# ============================================
# Nivel de logging para Hibernate (solo warnings y errores)
logging.level.org.hibernate=WARN

# NO mostrar SQL en producción (seguridad y rendimiento)
logging.level.org.hibernate.SQL=WARN

# NO mostrar parámetros SQL en producción (seguridad)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# NO mostrar valores extraídos en producción
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=WARN

# Nivel de logging para transacciones de Hibernate
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=WARN

# Nivel de logging para caché de Hibernate
logging.level.org.hibernate.cache=WARN

# NO mostrar estadísticas en producción
logging.level.org.hibernate.stat=WARN

# Nivel de logging para motor de Hibernate
logging.level.org.hibernate.engine=WARN

# ============================================
# LOGS DE HIKARICP - PRODUCCIÓN
# ============================================
# Nivel de logging para HikariCP (solo información importante)
logging.level.com.zaxxer.hikari=INFO

# Configuración de HikariCP (solo warnings)
logging.level.com.zaxxer.hikari.HikariConfig=WARN

# Pool de HikariCP (información importante)
logging.level.com.zaxxer.hikari.pool=INFO

# Detección de fugas de HikariCP (crítico en producción)
logging.level.com.zaxxer.hikari.pool.ProxyLeakTask=ERROR

# ============================================
# LOGS DE OTRAS LIBRERÍAS - PRODUCCIÓN
# ============================================
# Nivel de logging para driver PostgreSQL
logging.level.org.postgresql=WARN

# Nivel de logging para Jackson (serialización JSON)
logging.level.com.fasterxml.jackson=WARN

# Nivel de logging para Tomcat embebido
logging.level.org.apache.catalina=WARN

# Nivel de logging para Tomcat Coyote (conector HTTP)
logging.level.org.apache.coyote=WARN

# Nivel de logging para SpringDoc OpenAPI
logging.level.org.springdoc=WARN

# Nivel de logging para Micrometer (métricas)
logging.level.io.micrometer=INFO

# Nivel de logging para Actuator
logging.level.org.springframework.boot.actuate=INFO

# ============================================
# CONFIGURACIÓN DE ARCHIVOS DE LOG - PRODUCCIÓN
# ============================================
# Configuración de archivo de log
logging.file.name=logs/msbiosuper.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# Patrón de logging para archivo (formato JSON estructurado)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n

# Patrón de logging para consola (formato compacto para producción)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-}] %logger{36} - %msg%n

# ============================================
# CONFIGURACIÓN DE ACTUATOR - PRODUCCIÓN
# ============================================
# Endpoints expuestos en producción (solo los esenciales)
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# NO mostrar detalles de health por defecto (seguridad)
management.endpoint.health.show-details=when-authorized

# Mostrar componentes individuales solo cuando autorizado
management.endpoint.health.show-components=when-authorized

# Habilitar health checks críticos
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Configuración de sondas de liveness y readiness para Kubernetes
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Configuración de grupos de health checks
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace

# Base path para endpoints de actuator
management.endpoints.web.base-path=/actuator

# CORS restrictivo para endpoints de actuator
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
management.endpoints.web.cors.allowed-methods=GET

# Configuración de seguridad para actuator
management.endpoint.health.roles=ACTUATOR
management.endpoint.info.roles=ACTUATOR
management.endpoint.metrics.roles=ACTUATOR
management.endpoint.prometheus.roles=ACTUATOR

# ============================================
# CONFIGURACIÓN DE MÉTRICAS Y PROMETHEUS - PRODUCCIÓN
# ============================================
# Habilitar métricas JVM (críticas para monitoreo)
management.metrics.enable.jvm=true
management.metrics.jvm.memory.enabled=true
management.metrics.jvm.gc.enabled=true
management.metrics.jvm.threads.enabled=true
management.metrics.jvm.classes.enabled=true

# Habilitar métricas del sistema operativo
management.metrics.enable.system=true
management.metrics.system.cpu.enabled=true
management.metrics.system.diskspace.enabled=true

# Habilitar métricas de proceso
management.metrics.enable.process=true
management.metrics.process.cpu.enabled=true
management.metrics.process.uptime.enabled=true
management.metrics.process.files.enabled=true

# Habilitar métricas HTTP (críticas para SLA)
management.metrics.enable.http=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.web.server.request.autotime.percentiles=0.5,0.95,0.99
management.metrics.web.server.request.autotime.percentiles-histogram=true

# Habilitar métricas de base de datos (HikariCP)
management.metrics.enable.jdbc=true
management.metrics.jdbc.datasource.enabled=true

# Configuración de Prometheus (habilitado para monitoreo)
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=30s
management.metrics.export.prometheus.descriptions=true

# Configuración de distribución de métricas para SLA
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s,5s

# Tags comunes para todas las métricas (identificación en producción)
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=prod
management.metrics.tags.version=${app.version}

# ============================================
# CONFIGURACIÓN DE SEGURIDAD JWT - PRODUCCIÓN
# ============================================
# IMPORTANTE: La clave secreta JWT DEBE ser proporcionada mediante variable de entorno
# Debe ser una cadena de al menos 512 bits (64 caracteres) codificada en Base64
# Usar scripts/generate-jwt-secret.sh para generar una clave segura
jwt.secret=${JWT_SECRET}

# Tiempo de expiración del token más corto en producción (1 hora = 3600000 ms)
jwt.expiration=${JWT_EXPIRATION:3600000}

# ============================================
# CONFIGURACIÓN DE CORS - PRODUCCIÓN
# ============================================
# Orígenes permitidos RESTRICTIVOS (solo dominios autorizados)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Métodos HTTP permitidos (solo los necesarios)
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Headers permitidos (restrictivo)
cors.allowed-headers=Content-Type,Authorization,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers

# Permitir credenciales (necesario para JWT)
cors.allow-credentials=true

# Tiempo de caché para preflight requests
cors.max-age=3600

# ============================================
# CONFIGURACIÓN DE OPENAPI/SWAGGER - PRODUCCIÓN
# ============================================
# IMPORTANTE: Considerar deshabilitar en producción por seguridad
# Habilitar solo si se necesita documentación pública

# Habilitar OpenAPI (configurable)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# Path de la documentación OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Path de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Habilitar Swagger UI (configurable)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Configuración de Swagger UI para producción
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=false

# Deshabilitar try-it-out por defecto en producción
springdoc.swagger-ui.try-it-out-enabled=false

# ============================================
# CONFIGURACIÓN DE INFORMACIÓN DE LA API - PRODUCCIÓN
# ============================================
# Versión de la aplicación
app.version=${APP_VERSION:1.0.0}

# URLs de servidores (producción)
app.api.dev-url=${API_DEV_URL:http://localhost:8080}
app.api.staging-url=${API_STAGING_URL:https://staging-api.acosux.com}
app.api.prod-url=${API_PROD_URL:https://api.acosux.com}

# ============================================
# CONFIGURACIÓN DE CACHÉ - PRODUCCIÓN
# ============================================
# Habilitar caché para mejor rendimiento
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# ============================================
# CONFIGURACIÓN DE JACKSON - PRODUCCIÓN
# ============================================
# Configuración de serialización JSON optimizada
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-durations-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false

# Configuración de timezone para JSON
spring.jackson.time-zone=UTC

# ============================================
# CONFIGURACIÓN DE VALIDACIÓN - PRODUCCIÓN
# ============================================
# Habilitar validación de beans
spring.validation.enabled=true

# ============================================
# CONFIGURACIÓN DE TRANSACCIONES - PRODUCCIÓN
# ============================================
# Configuración de transacciones optimizada
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# ============================================
# CONFIGURACIÓN DE THREAD POOL - PRODUCCIÓN
# ============================================
# Configuración de thread pool para tareas asíncronas
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=msbiosuper-async-

# ============================================
# CONFIGURACIÓN DE SEGURIDAD ADICIONAL - PRODUCCIÓN
# ============================================
# Ocultar información del servidor en headers HTTP
server.server-header=

# Configuración de headers de seguridad
server.servlet.session.cookie.name=MSBIOSUPERSESSIONID

# ============================================
# CONFIGURACIÓN DE MONITOREO Y ALERTAS
# ============================================
# Configuración para integración con sistemas de monitoreo
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Información personalizada de la aplicación
info.app.name=MSBioSuper
info.app.description=Microservicio de gestión acuícola
info.app.version=${app.version}
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# ============================================
# NOTAS DE PRODUCCIÓN
# ============================================
# - Esta configuración está optimizada para entornos de producción
# - Todas las credenciales sensibles DEBEN ser proporcionadas via variables de entorno
# - El logging está configurado para minimizar impacto en rendimiento
# - Las métricas están habilitadas para monitoreo y alertas
# - CORS está configurado de forma restrictiva
# - Swagger puede estar deshabilitado por seguridad
# - La configuración de caché mejora el rendimiento
# - Los timeouts están optimizados para alta disponibilidad
# - La compresión HTTP está habilitada para reducir ancho de banda
# - HTTP/2 está habilitado para mejor rendimiento
# - Los headers de seguridad están configurados
# - El pool de conexiones está optimizado para alta carga
